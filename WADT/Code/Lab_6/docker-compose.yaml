services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2019-latest
    container_name: mssql2019
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Developer"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    shm_size: "1gb"
    volumes:
      - ./mssql/data:/var/opt/mssql/data
      - ./mssql/log:/var/opt/mssql/log
      - ./mssql/secrets:/var/opt/mssql/secrets
    networks:
      - backend

  nginx:
    image: nginx:latest
    container_name: nginx-mssql-proxy
    depends_on:
      - mssql
    ports:
      - "1434:1433"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/stream.d:/etc/nginx/stream.d:ro
    networks:
      - backend

networks:
  backend:
    driver: bridge
